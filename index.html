<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5dfed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Eye Sees You · Hydra Missions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, Arial, sans-serif;
  color: #123e59;
}

body {
  background: #aad8eb;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

.water {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 15% 8%, #e1f5f4 0, transparent 53%),
    radial-gradient(ellipse at 85% 72%, #58b1d0 0, transparent 62%),
    linear-gradient(145deg, #b9e7ec, #81c7e1 50%, #d7eeee);
}

.water::after {
  content: "";
  position: absolute;
  inset: -12%;
  background:
    radial-gradient(ellipse at 28% 35%, #efffff80, transparent 48%),
    radial-gradient(ellipse at 78% 68%, #45a8cf35, transparent 52%);
  animation: water-light 18s ease-in-out infinite alternate;
  will-change: transform, opacity;
}

@keyframes water-light {
  0% {
    transform: translate(-3%, -2%) scale(1);
    opacity: .65;
  }
  50% {
    opacity: .95;
  }
  100% {
    transform: translate(3%, 3%) scale(1.07);
    opacity: .75;
  }
}

#water-canvas {
  width: 100%;
  height: 100%;
  opacity: .78;
}

.app {
  position: relative;
  min-height: 100svh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 20px;
  padding:
    max(30px, env(safe-area-inset-top))
    20px
    max(20px, env(safe-area-inset-bottom));
  text-align: center;
}

header {
  padding: 10px 0 0;
}

.brand {
  margin: 0;
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
  font-weight: 400;
}

.subtitle {
  margin: 12px 0 0;
  font-size: 16px;
  font-style: italic;
  font-weight: 300;
  letter-spacing: .1em;
}

.caption {
  margin: 14px 0 0;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #37637a;
}

main {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 16px 0;
}

.circle {
  position: relative;
  flex: none;
  width: min(82vw, 480px, 53svh);
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(
    circle at 36% 28%,
    #f5ffffdb,
    #e1f5f3b8 38%,
    #b3e2ecb8 74%,
    #93cddfc7
  );
  border: 1px solid #f3ffffc9;
  box-shadow:
    inset 0 0 48px #ffffff70,
    0 0 50px #e6ffff70,
    0 0 100px #e9ffff35;
  backdrop-filter: blur(3px);
}

.circle::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid #ffffff65;
  border-radius: 50%;
  pointer-events: none;
}

.mission-box {
  position: absolute;
  inset: 16%;
  display: grid;
  place-items: center;
}

#mission {
  margin: 0;
  width: 100%;
  text-align: center;
  font-size: 25px;
  font-weight: 300;
  font-style: italic;
  line-height: 1.45;
  overflow-wrap: normal;
  text-wrap: pretty;
  color: #123e59;
}

.controls {
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 12px;
}

.sound {
  border: 1px solid #346d8580;
  color: #174d68;
  background: #edffff45;
  min-height: 44px;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 10px;
  letter-spacing: .15em;
  cursor: pointer;
}

.hint {
  margin: 0;
  font-size: 9px;
  letter-spacing: .12em;
  line-height: 1.7;
  color: #315a71;
}

.copyright {
  margin: 9px 0 0;
  font-size: 8px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: #3d687e;
}

button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 4px;
}

@media (max-width: 370px) {
  .app {
    padding-left: 12px;
    padding-right: 12px;
    gap: 12px;
  }
  .brand {
    font-size: 10px;
  }
  .hint {
    max-width: 260px;
  }
  .circle {
    width: min(86vw, 50svh);
  }
}

@media (max-height: 650px) {
  .app {
    gap: 8px;
    padding-top: 15px;
    padding-bottom: 12px;
  }
  header {
    padding: 0;
  }
  .subtitle {
    margin-top: 7px;
  }
  .caption {
    display: none;
  }
  main {
    padding: 4px 0;
  }
  .controls {
    gap: 6px;
  }
  .circle {
    width: min(75vw, 46svh);
  }
  .copyright {
    margin-top: 3px;
  }
}

@media (orientation: landscape) and (max-height: 600px) {
  .app {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    padding: 18px 30px;
  }
  header {
    grid-column: 2;
    grid-row: 1;
    align-self: end;
  }
  main {
    grid-column: 1;
    grid-row: 1 / 3;
  }
  .controls {
    grid-column: 2;
    grid-row: 2;
    justify-content: center;
  }
  .circle {
    width: min(43vw, 82svh);
  }
}

@media (prefers-reduced-motion: reduce) {
  .water::after {
    animation: none;
  }
}

body.paused .water::after {
  animation-play-state: paused;
}
</style>
</head>

const text = document.getElementById("mission");
const box = document.querySelector(".mission-box");
const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
);

const dailyStorageKey = "hydra-daily-mission-v1";

const hydraDate = new Intl.DateTimeFormat("en-CA", {
  timeZone: "Europe/Athens",
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
});

let currentDailyMission = null;

function dayOnHydra(now = new Date()) {
  const parts = hydraDate.formatToParts(now);

  return ["year", "month", "day"]
    .map(type => parts.find(part => part.type === type).value)
    .join("-");
}

function readDailyMission() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(dailyStorageKey)
    );

    if (
      saved &&
      typeof saved.day === "string" &&
      missions.includes(saved.mission)
    ) {
      return saved;
    }
  } catch (_) {
    // Storage may be unavailable in restricted browsers.
  }

  return null;
}

function updateDailyMission() {
  const today = dayOnHydra();
  const saved = readDailyMission();

  let selected =
    saved && saved.day === today
      ? saved
      : currentDailyMission;

  if (!selected || selected.day !== today) {
    const previous = currentDailyMission || saved;

    const candidates = missions.filter(
      mission => !previous || mission !== previous.mission
    );

    selected = {
      day: today,
      mission: candidates[
        Math.floor(Math.random() * candidates.length)
      ]
    };

    try {
      localStorage.setItem(
        dailyStorageKey,
        JSON.stringify(selected)
      );
    } catch (_) {}
  }

  currentDailyMission = selected;

  if (text.textContent !== selected.mission) {
    text.textContent = selected.mission;
    fitText();
  }
}

function fitText() {
  let size = Math.min(29, box.clientWidth * .115);
  text.style.fontSize = size + "px";

  while (
    (
      text.scrollHeight > box.clientHeight ||
      text.scrollWidth > box.clientWidth
    ) &&
    size > 8
  ) {
    size -= .5;
    text.style.fontSize = size + "px";
  }
}

updateDailyMission();

setInterval(updateDailyMission, 1000);

window.addEventListener("pageshow", updateDailyMission);
window.addEventListener("focus", updateDailyMission);

window.addEventListener("storage", event => {
  if (event.key === dailyStorageKey) {
    updateDailyMission();
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    updateDailyMission();
  }
});

new ResizeObserver(fitText).observe(box);

if (document.fonts) {
  document.fonts.ready.then(fitText);
}

const sound = document.getElementById("sound");

sound.addEventListener("click", async () => {
  if (!audio.paused) {
    audio.pause();
    sound.textContent = "♫ Sound on";
    sound.setAttribute("aria-pressed", "false");
    return;
  }

  try {
    await audio.play();
    sound.textContent = "♫ Sound off";
    sound.setAttribute("aria-pressed", "true");
  } catch (_) {
    sound.textContent = "Sound unavailable";
    sound.setAttribute("aria-pressed", "false");
  }
});

/* Animated water reflections */

const canvas = document.getElementById("water-canvas");
const ctx = canvas.getContext("2d");

let w = 0;
let h = 0;
let frame = 0;
let previous = 0;

function resizeWater() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  w = window.innerWidth;
  h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintWater(0);
}

function paintWater(t) {
  ctx.clearRect(0, 0, w, h);

  const scale = Math.max(w, h) / 650;

  ctx.save();
  ctx.scale(scale, scale);

  const ww = w / scale;
  const hh = h / scale;

  for (let family = 0; family < 2; family++) {
    for (let i = -3; i < 15; i++) {
      ctx.beginPath();

      for (
        let v = -80;
        v < Math.max(ww, hh) + 100;
        v += 5
      ) {
        const drift =
          19 * Math.sin(v * .022 + t * .32 + i * .9) +
          10 * Math.sin(v * .047 - t * .23 + i * 1.7);

        const base = i * 64 + drift;
        const x = family === 0 ? v : base + v * .22;
        const y = family === 0 ? base + v * .29 : v;

        if (v === -80) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.strokeStyle = "rgba(238,255,255,.19)";
      ctx.lineWidth = 9;
      ctx.shadowBlur = 13;
      ctx.shadowColor = "#efffff";
      ctx.stroke();

      ctx.strokeStyle = "rgba(250,255,255,.38)";
      ctx.lineWidth = 1.6;
      ctx.shadowBlur = 4;
      ctx.stroke();
    }
  }

  ctx.restore();
}

function animate(ms) {
  if (ms - previous > 40) {
    paintWater(ms / 1000);
    previous = ms;
  }

  frame = requestAnimationFrame(animate);
}

function syncMotion() {
  document.body.classList.toggle(
    "paused",
    document.hidden
  );

  cancelAnimationFrame(frame);

  if (!reducedMotion.matches && !document.hidden) {
    frame = requestAnimationFrame(animate);
  } else {
    paintWater(0);
  }
}

window.addEventListener("resize", resizeWater);
document.addEventListener("visibilitychange", syncMotion);
reducedMotion.addEventListener("change", syncMotion);

resizeWater();
syncMotion();
